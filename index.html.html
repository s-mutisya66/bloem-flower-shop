<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloem &amp; Co. — Flowers for the moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF1F4; --plum:#c710cd; --rose:#d70a2c; --sage:#fe066d;
    --blush:#FFD3E0; --line: rgba(58,13,20,.16); --white:#FFFFFF;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --cream:#22090D; --plum:#FBE4E9; --white:#301019; --line: rgba(251,228,233,.16); --blush:#4A0F1D; }
  }
  :root[data-theme="dark"]{ --cream:#22090D; --plum:#FBE4E9; --white:#301019; --line: rgba(251,228,233,.16); --blush:#4A0F1D; }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{margin:0;background:var(--cream);color:var(--plum);font-family:'Karla',sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  header.site{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
  .navbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;max-width:1080px;margin:0 auto;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.02em;}
  .navlinks{display:flex;gap:28px;font-size:15px;}
  .navlinks button{padding:4px 0;border-bottom:2px solid transparent;}
  .navlinks button.active{border-color:var(--rose);}
  .cart-btn{position:relative;font-size:15px;}
  .cart-count{position:absolute;top:-8px;right:-14px;background:var(--rose);color:var(--white);border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;}

  /* HERO */
  .hero{position:relative;padding:64px 24px 90px;overflow:hidden;}
  .hero-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;}
  .hero h1{font-size:clamp(44px,7vw,78px);line-height:1.02;font-style:italic;font-weight:500;}
  .hero p{max-width:38ch;margin-top:18px;font-size:17px;color:var(--plum);opacity:.8;}
  .hero .cta{margin-top:28px;display:inline-block;background:var(--plum);color:var(--cream);padding:13px 26px;border-radius:2px;font-size:15px;}
  .bouquet{position:relative;height:320px;}
  .blob{position:absolute;border-radius:50% 45% 55% 50%/55% 50% 50% 45%;}
  .blob.a{width:190px;height:190px;background:var(--rose);top:10px;left:60px;}
  .blob.b{width:150px;height:150px;background:var(--sage);top:110px;left:200px;opacity:.9;}
  .blob.c{width:120px;height:120px;background:var(--blush);top:0px;left:220px;}
  .ribbon{position:absolute;left:0;right:0;bottom:0;height:60px;}
  .ribbon svg{width:100%;height:100%;display:block;}

  section{padding:56px 24px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:8px;}
  .section-head h2{font-size:34px;font-style:italic;}
  .filter-row{display:flex;gap:10px;flex-wrap:wrap;}
  .filter-row button{font-size:14px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;}
  .filter-row button.active{background:var(--plum);color:var(--cream);border-color:var(--plum);}

  .grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 22px;}
  .card{cursor:pointer;}
  .thumb{aspect-ratio:4/5;border-radius:6px;position:relative;overflow:hidden;margin-bottom:12px;display:flex;align-items:center;justify-content:center;}
  .thumb .petal{position:absolute;border-radius:50%;}
  .card h3{font-size:20px;margin-bottom:2px;}
  .card .price{font-size:14px;opacity:.75;}
  .card .add{margin-top:8px;font-size:13px;text-decoration:underline;text-underline-offset:3px;}

  /* PRODUCT DETAIL */
  .detail-wrap{max-width:900px;margin:0 auto;padding:40px 24px 90px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;}
  .detail-thumb{aspect-ratio:4/5;border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .detail-thumb .petal{position:absolute;width:72%;height:72%;opacity:.85;border-radius:48% 52% 55% 45%/55% 45% 55% 45%;}
  .detail-tag{font-size:13px;opacity:.6;margin-bottom:6px;}
  .detail-name{font-size:38px;font-style:italic;margin-bottom:8px;}
  .detail-price{font-size:20px;margin-bottom:18px;}
  .detail-desc{opacity:.8;margin-bottom:24px;max-width:46ch;}
  .qty-row{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .qty-row .qty-ctrl button{width:30px;height:30px;font-size:16px;}
  @media (max-width:640px){ .detail-grid{grid-template-columns:1fr;} }

  /* ADMIN */
  .admin-wrap{max-width:900px;margin:0 auto;padding:40px 24px 90px;}
  .admin-table{width:100%;border-collapse:collapse;margin-bottom:44px;font-size:14px;}
  .admin-table th{text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);opacity:.7;font-size:13px;}
  .admin-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .admin-table input{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--white);color:var(--plum);font-size:14px;}
  .stock-low{color:var(--rose);font-weight:700;}
  .orders-empty{opacity:.6;font-size:14px;}
  .order-card{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px;font-size:14px;}
  .order-card .oh{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:700;}

  /* CART DRAWER */
  .overlay{position:fixed;inset:0;background:rgba(58,42,52,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--white);z-index:31;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);}
  .drawer-head h3{font-size:24px;}
  .drawer-items{flex:1;overflow-y:auto;padding:16px 22px;}
  .line-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .li-thumb{width:56px;height:56px;border-radius:6px;flex-shrink:0;}
  .li-body{flex:1;}
  .li-body .row{display:flex;justify-content:space-between;font-size:14px;margin-top:4px;}
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{width:22px;height:22px;border:1px solid var(--line);border-radius:50%;font-size:13px;line-height:1;}
  .drawer-foot{padding:20px 22px;border-top:1px solid var(--line);}
  .drawer-foot .row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:14px;}
  .btn-primary{display:block;width:100%;text-align:center;background:var(--plum);color:var(--cream);padding:13px;border-radius:2px;font-size:15px;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .empty-note{opacity:.6;font-size:14px;padding:30px 0;text-align:center;}

  /* CHECKOUT VIEW */
  .checkout-wrap{max-width:640px;margin:0 auto;padding:40px 24px 90px;}
  .steps{display:flex;gap:24px;margin-bottom:34px;border-bottom:1px solid var(--line);}
  .steps span{padding-bottom:12px;font-size:14px;opacity:.45;position:relative;}
  .steps span.done{opacity:.9;}
  .steps span.current{opacity:1;font-weight:700;}
  .steps span.current::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--rose);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;margin-bottom:6px;opacity:.75;}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--white);color:var(--plum);font-family:inherit;font-size:15px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .demo-note{background:var(--blush);border-radius:6px;padding:12px 14px;font-size:13px;margin-bottom:20px;}
  .order-line{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);}
  .total-line{display:flex;justify-content:space-between;font-size:18px;font-family:'Cormorant Garamond',serif;margin-top:14px;}
  .step-actions{display:flex;justify-content:space-between;margin-top:26px;}
  .link-btn{font-size:14px;text-decoration:underline;text-underline-offset:3px;}
  .confirm{text-align:center;padding:60px 24px;}
  .confirm .mark{width:64px;height:64px;border-radius:50%;background:var(--sage);margin:0 auto 22px;display:flex;align-items:center;justify-content:center;color:var(--white);font-size:28px;}
  .confirm h2{font-size:36px;font-style:italic;margin-bottom:10px;}

  footer{padding:34px 24px;text-align:center;font-size:13px;opacity:.6;border-top:1px solid var(--line);}
  [hidden]{display:none !important;}
  @media (max-width:720px){ .hero-inner{grid-template-columns:1fr;} .bouquet{height:220px;} .field-row{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <div class="brand">Bloem &amp; Co.</div>
    <nav class="navlinks">
      <button id="nav-shop" class="active">Shop</button>
      <button id="nav-admin">Admin</button>
    </nav>
    <button class="cart-btn" id="open-cart">Cart <span class="cart-count" id="cart-count" hidden>0</span></button>
  </div>
</header>

<main id="shop-view">
  <section class="hero">
    <div class="hero-inner">
      <div>
        <h1>Flowers for<br>the moment.</h1>
        <p>Small-batch bouquets, arranged the morning they're delivered. Locally grown where we can, always seasonal.</p>
        <a href="#catalog" class="cta">Browse the shop</a>
      </div>
      <div class="bouquet" aria-hidden="true">
        <div class="blob a"></div>
        <div class="blob b"></div>
        <div class="blob c"></div>
      </div>
    </div>
    <div class="ribbon" aria-hidden="true">
      <svg viewBox="0 0 1080 60" preserveAspectRatio="none"><path d="M0,30 C 270,60 810,0 1080,30 L1080,60 L0,60 Z" fill="var(--blush)"></path></svg>
    </div>
  </section>

  <section id="catalog">
    <div class="section-head">
      <h2>The catalog</h2>
      <div class="filter-row" id="filters"></div>
    </div>
    <div class="grid" id="product-grid"></div>
  </section>

  <footer>Bloem &amp; Co. — a portfolio project. Payment is simulated; no real transactions are made.</footer>
</main>

<div id="admin-view" hidden></div>
<div id="detail-view" hidden></div>
<div id="checkout-view" hidden></div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h3>Your cart</h3><button id="close-cart" aria-label="Close">&#10005;</button></div>
  <div class="drawer-items" id="drawer-items"></div>
  <div class="drawer-foot">
    <div class="row"><span>Subtotal</span><span id="drawer-subtotal">$0.00</span></div>
    <button class="btn-primary" id="checkout-btn" disabled>Checkout</button>
  </div>
</aside>

<script>
const PRODUCTS = [
  {id:'p1', name:'Crimson Rose Bundle', price:38, tag:'roses', color:'#C81E3A', img:'https://loremflickr.com/600/750/red,rose,flower/all?lock=101', desc:'A dozen deep-red garden roses, cut long for a loose, unstructured hand-tie.'},
  {id:'p2', name:'Hot Pink Ranunculus Posy', price:32, tag:'seasonal', color:'#FF3E8E', img:'https://loremflickr.com/600/750/pink,ranunculus,flower/all?lock=102', desc:'Vivid pink ranunculus and stock, wrapped small enough to sit on a nightstand.'},
  {id:'p3', name:'Scarlet Peony Cloud', price:52, tag:'peonies', color:'#D6123C', img:'https://loremflickr.com/600/750/red,peony,flower/all?lock=103', desc:'Eight richly saturated red peonies at full bloom — the showpiece for a table that needs one thing to talk about.'},
  {id:'p4', name:'Fuchsia Meadow Mix', price:29, tag:'seasonal', color:'#E0227A', img:'https://loremflickr.com/600/750/fuchsia,wildflower,pink/all?lock=104', desc:'Whatever is growing this week in hot pinks and reds, gathered like it was picked from a roadside.'},
  {id:'p5', name:'Rouge Ranunculus', price:34, tag:'roses', color:'#B4102B', img:'https://loremflickr.com/600/750/red,ranunculus,flower/all?lock=105', desc:'Layered, paper-thin ranunculus petals in deep rouge, arranged tight and low in a hand-tied dome.'},
  {id:'p6', name:'Dried Rose Sheaf', price:24, tag:'dried', color:'#8A1228', img:'https://loremflickr.com/600/750/dried,red,rose/all?lock=106', desc:'A bound sheaf of dried red roses that keeps its colour for months — no water needed.'},
  {id:'p7', name:'Magenta Anemone Study', price:36, tag:'seasonal', color:'#C21463', img:'https://loremflickr.com/600/750/magenta,anemone,flower/all?lock=107', desc:'Dark-centred anemones in magenta and crimson, a bold, graphic take on a bouquet.'},
  {id:'p8', name:'Blush & Peony', price:46, tag:'peonies', color:'#FF5C8A', img:'https://loremflickr.com/600/750/pink,peony,bouquet/all?lock=108', desc:'Vibrant pink peonies wrapped tight — six blooms doing all the work.'},
  {id:'p9', name:'Everlasting Red Mix', price:27, tag:'dried', color:'#9E1030', img:'https://loremflickr.com/600/750/dried,red,flowers/all?lock=109', desc:'Dried straw flower and gypsophila dyed deep red and pink — a bouquet with no expiry date.'},
];
const TAGS = ['all', ...Array.from(new Set(PRODUCTS.map(p=>p.tag)))];
let cart = {}; // id -> qty
let activeFilter = 'all';
let stock = {}; // id -> qty on hand
let orders = []; // {num, name, email, items:[{name,qty,price}], total, date}

function loadStock(){
  try{
    const raw = localStorage.getItem('bloem_stock');
    stock = raw ? JSON.parse(raw) : {};
  }catch(e){ stock = {}; }
  PRODUCTS.forEach(p=>{ if(!(p.id in stock)) stock[p.id] = 20; });
}
function saveStock(){ try{ localStorage.setItem('bloem_stock', JSON.stringify(stock)); }catch(e){} }
function loadOrders(){
  try{ orders = JSON.parse(localStorage.getItem('bloem_orders')||'[]'); }catch(e){ orders = []; }
}
function saveOrders(){ try{ localStorage.setItem('bloem_orders', JSON.stringify(orders)); }catch(e){} }

const fmt = n => '$' + n.toFixed(2);

function flowerSVG(tag, color){
  const c = color;
  if(tag==='roses') return `<svg viewBox="0 0 100 100" width="62%" height="62%"><g fill="none" stroke="${c}" stroke-width="2.5">
    <circle cx="50" cy="50" r="8" fill="${c}"/>
    <circle cx="50" cy="50" r="18"/><circle cx="50" cy="50" r="28"/><circle cx="50" cy="50" r="37" stroke-dasharray="4 6"/>
  </g></svg>`;
  if(tag==='peonies') return `<svg viewBox="0 0 100 100" width="68%" height="68%">
    ${[0,60,120,180,240,300].map(a=>`<ellipse cx="50" cy="28" rx="13" ry="20" fill="${c}" opacity=".85" transform="rotate(${a} 50 50)"/>`).join('')}
    <circle cx="50" cy="50" r="9" fill="${c}"/>
  </svg>`;
  if(tag==='dried') return `<svg viewBox="0 0 100 100" width="60%" height="60%"><g stroke="${c}" stroke-width="2.5" fill="none">
    <line x1="50" y1="90" x2="50" y2="20"/>
    ${[[20,55,28],[20,40,15],[-20,55,-28],[-20,40,-15],[0,25,0]].map(([dx,y,rot])=>`<line x1="50" y1="${y}" x2="${50+dx}" y2="${y-15}" transform="rotate(${rot} 50 ${y})"/>`).join('')}
  </g></svg>`;
  return `<svg viewBox="0 0 100 100" width="65%" height="65%">
    ${[0,72,144,216,288].map(a=>`<ellipse cx="50" cy="26" rx="9" ry="17" fill="${c}" opacity=".8" transform="rotate(${a} 50 50)"/>`).join('')}
    <circle cx="50" cy="50" r="7" fill="${c}" opacity=".95"/>
  </svg>`;
}
const grid = document.getElementById('product-grid');
const filtersEl = document.getElementById('filters');

function renderFilters(){
  filtersEl.innerHTML = TAGS.map(t=>`<button data-tag="${t}" class="${t===activeFilter?'active':''}">${t}</button>`).join('');
  filtersEl.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ activeFilter=b.dataset.tag; renderFilters(); renderGrid(); }));
}

function renderGrid(){
  const list = activeFilter==='all' ? PRODUCTS : PRODUCTS.filter(p=>p.tag===activeFilter);
  grid.innerHTML = list.map(p=>{
    const soldOut = (stock[p.id]||0) <= 0;
    return `
    <div class="card" data-id="${p.id}" style="${soldOut?'opacity:.5;':''}">
      <div class="thumb" style="background:${p.color}1c">
        <img src="${p.img}" alt="${p.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover;"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{innerHTML:flowerSVG('${p.tag}','${p.color}'),style:'display:contents'}))">
      </div>
      <h3>${p.name}</h3>
      <div class="price">${fmt(p.price)}</div>
      ${soldOut ? '<div class="add" style="opacity:.7;">Sold out</div>' : `<button class="add" data-add="${p.id}">Add to cart</button>`}
    </div>
  `;}).join('');
  grid.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); addToCart(btn.dataset.add); });
  });
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openDetail(card.dataset.id));
  });
}

const detailView = document.getElementById('detail-view');
function openDetail(id){
  const p = PRODUCTS.find(p=>p.id===id);
  if(!p) return;
  let qty = 1;
  const render = ()=>{
    detailView.innerHTML = `<div class="detail-wrap">
      <button class="link-btn" id="detail-back">&larr; Back to shop</button>
      <div class="detail-grid" style="margin-top:20px;">
        <div class="detail-thumb" style="background:${p.color}1c">
          <img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{innerHTML:flowerSVG('${p.tag}','${p.color}'),style:'display:contents'}))">
        </div>
        <div>
          <div class="detail-tag">${p.tag}</div>
          <h2 class="detail-name">${p.name}</h2>
          <div class="detail-price">${fmt(p.price)}</div>
          <p class="detail-desc">${p.desc||''}</p>
          ${(stock[p.id]||0) <= 0 ? '<p style="opacity:.7;margin-bottom:20px;">Currently sold out.</p>' : `
          <div class="qty-row">
            <span style="font-size:14px;opacity:.75;">Quantity</span>
            <div class="qty-ctrl"><button id="d-dec">&minus;</button><span id="d-qty">${qty}</span><button id="d-inc">+</button></div>
          </div>
          <button class="btn-primary" style="width:auto;padding:12px 30px;" id="d-add">Add to cart</button>`}
        </div>
      </div>
    </div>`;
    document.getElementById('detail-back').addEventListener('click', ()=>{ detailView.hidden=true; shopView.hidden=false; });
    const inc = document.getElementById('d-inc'), dec = document.getElementById('d-dec'), add = document.getElementById('d-add');
    if(inc) inc.addEventListener('click', ()=>{ if(qty < (stock[p.id]||0)){ qty++; render(); } });
    if(dec) dec.addEventListener('click', ()=>{ if(qty>1){ qty--; render(); } });
    if(add) add.addEventListener('click', ()=>{
      addToCart(p.id, qty);
      detailView.hidden=true; shopView.hidden=false;
    });
  };
  render();
  shopView.hidden = true;
  detailView.hidden = false;
  window.scrollTo(0,0);
}

function addToCart(id, amount=1){
  const cap = stock[id] ?? 999;
  const next = (cart[id]||0)+amount;
  cart[id] = Math.min(next, cap);
  saveCart();
  renderCart();
  openDrawer();
}
function changeQty(id, delta){
  cart[id] = (cart[id]||0)+delta;
  if(cart[id]<=0) delete cart[id];
  saveCart();
  renderCart();
}
function cartTotal(){
  return Object.entries(cart).reduce((sum,[id,qty])=>{
    const p = PRODUCTS.find(p=>p.id===id);
    return sum + (p?p.price*qty:0);
  },0);
}
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }

function renderCart(){
  const items = Object.entries(cart);
  const dItems = document.getElementById('drawer-items');
  if(items.length===0){
    dItems.innerHTML = '<div class="empty-note">Your cart is empty — add a bouquet to get started.</div>';
  } else {
    dItems.innerHTML = items.map(([id,qty])=>{
      const p = PRODUCTS.find(p=>p.id===id);
      return `<div class="line-item">
        <div class="li-thumb" style="background:${p.color}"></div>
        <div class="li-body">
          <div>${p.name}</div>
          <div class="row">
            <div class="qty-ctrl">
              <button data-dec="${id}">&minus;</button><span>${qty}</span><button data-inc="${id}">+</button>
            </div>
            <span>${fmt(p.price*qty)}</span>
          </div>
        </div>
      </div>`;
    }).join('');
    dItems.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.inc,1)));
    dItems.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.dec,-1)));
  }
  document.getElementById('drawer-subtotal').textContent = fmt(cartTotal());
  const count = cartCount();
  const countEl = document.getElementById('cart-count');
  countEl.textContent = count;
  countEl.hidden = count===0;
  document.getElementById('checkout-btn').disabled = count===0;
}

function saveCart(){
  try{ localStorage.setItem('bloem_cart', JSON.stringify(cart)); }catch(e){}
}
function loadCart(){
  try{
    const raw = localStorage.getItem('bloem_cart');
    if(raw) cart = JSON.parse(raw);
  }catch(e){ cart = {}; }
}

// Drawer open/close
const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');
function openDrawer(){ overlay.classList.add('open'); drawer.classList.add('open'); }
function closeDrawer(){ overlay.classList.remove('open'); drawer.classList.remove('open'); }
document.getElementById('open-cart').addEventListener('click', openDrawer);
document.getElementById('close-cart').addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);

// ---- Checkout flow ----
const shopView = document.getElementById('shop-view');
const checkoutView = document.getElementById('checkout-view');
let checkoutStep = 'delivery'; // delivery -> payment -> review -> confirm
let orderInfo = {};

document.getElementById('checkout-btn').addEventListener('click', ()=>{
  if(cartCount()===0) return;
  closeDrawer();
  checkoutStep = 'delivery';
  shopView.hidden = true;
  checkoutView.hidden = false;
  renderCheckout();
  window.scrollTo(0,0);
});

function stepsBar(){
  const order = ['delivery','payment','review'];
  const labels = {delivery:'Delivery', payment:'Payment', review:'Review'};
  return `<div class="steps">${order.map(s=>{
    const cls = s===checkoutStep ? 'current' : (order.indexOf(s)<order.indexOf(checkoutStep)?'done':'');
    return `<span class="${cls}">${labels[s]}</span>`;
  }).join('')}</div>`;
}

function orderSummaryHTML(){
  const rows = Object.entries(cart).map(([id,qty])=>{
    const p = PRODUCTS.find(p=>p.id===id);
    return `<div class="order-line"><span>${p.name} × ${qty}</span><span>${fmt(p.price*qty)}</span></div>`;
  }).join('');
  return `${rows}<div class="total-line"><span>Total</span><span>${fmt(cartTotal())}</span></div>`;
}

function renderCheckout(){
  if(checkoutStep==='delivery'){
    checkoutView.innerHTML = `<div class="checkout-wrap">
      ${stepsBar()}
      <h2 style="font-size:26px;margin-bottom:18px;">Delivery details</h2>
      <div class="field"><label>Full name</label><input id="f-name" value="${orderInfo.name||''}" placeholder="Jane Wanjiru"></div>
      <div class="field-row">
        <div class="field"><label>Email</label><input id="f-email" type="email" value="${orderInfo.email||''}" placeholder="jane@example.com"></div>
        <div class="field"><label>Phone</label><input id="f-phone" value="${orderInfo.phone||''}" placeholder="07xx xxx xxx"></div>
      </div>
      <div class="field"><label>Delivery address</label><input id="f-address" value="${orderInfo.address||''}" placeholder="Street, city"></div>
      <div class="field"><label>Delivery date</label><input id="f-date" type="date" value="${orderInfo.date||''}"></div>
      <div class="step-actions">
        <button class="link-btn" id="back-shop">&larr; Back to shop</button>
        <button class="btn-primary" style="width:auto;padding:12px 28px;" id="to-payment">Continue to payment</button>
      </div>
    </div>`;
    document.getElementById('back-shop').addEventListener('click', ()=>{ shopView.hidden=false; checkoutView.hidden=true; });
    document.getElementById('to-payment').addEventListener('click', ()=>{
      orderInfo.name = document.getElementById('f-name').value.trim();
      orderInfo.email = document.getElementById('f-email').value.trim();
      orderInfo.phone = document.getElementById('f-phone').value.trim();
      orderInfo.address = document.getElementById('f-address').value.trim();
      orderInfo.date = document.getElementById('f-date').value;
      if(!orderInfo.name || !orderInfo.address){ alert('Please add your name and delivery address.'); return; }
      checkoutStep='payment'; renderCheckout();
    });
  }
  else if(checkoutStep==='payment'){
    checkoutView.innerHTML = `<div class="checkout-wrap">
      ${stepsBar()}
      <h2 style="font-size:26px;margin-bottom:14px;">Payment</h2>
      <div class="demo-note">This is a portfolio demo — no real payment is processed and no card details are stored.</div>
      <div class="field"><label>Name on card</label><input id="c-name" value="${orderInfo.cardName||''}" placeholder="Jane Wanjiru"></div>
      <div class="field"><label>Card number</label><input id="c-number" inputmode="numeric" maxlength="19" value="${orderInfo.cardNumber||''}" placeholder="4242 4242 4242 4242"></div>
      <div class="field-row">
        <div class="field"><label>Expiry</label><input id="c-exp" placeholder="MM/YY" value="${orderInfo.exp||''}"></div>
        <div class="field"><label>CVC</label><input id="c-cvc" inputmode="numeric" maxlength="3" placeholder="123" value="${orderInfo.cvc||''}"></div>
      </div>
      <div class="step-actions">
        <button class="link-btn" id="back-delivery">&larr; Back</button>
        <button class="btn-primary" style="width:auto;padding:12px 28px;" id="to-review">Review order</button>
      </div>
    </div>`;
    document.getElementById('back-delivery').addEventListener('click', ()=>{ checkoutStep='delivery'; renderCheckout(); });
    document.getElementById('to-review').addEventListener('click', ()=>{
      orderInfo.cardName = document.getElementById('c-name').value.trim();
      orderInfo.cardNumber = document.getElementById('c-number').value.trim();
      orderInfo.exp = document.getElementById('c-exp').value.trim();
      orderInfo.cvc = document.getElementById('c-cvc').value.trim();
      if(!orderInfo.cardName || orderInfo.cardNumber.replace(/\s/g,'').length<12){ alert('Please add card name and a card number.'); return; }
      checkoutStep='review'; renderCheckout();
    });
  }
  else if(checkoutStep==='review'){
    const last4 = (orderInfo.cardNumber||'').replace(/\s/g,'').slice(-4);
    checkoutView.innerHTML = `<div class="checkout-wrap">
      ${stepsBar()}
      <h2 style="font-size:26px;margin-bottom:18px;">Review &amp; confirm</h2>
      <div class="field"><label>Deliver to</label><div>${orderInfo.name} &middot; ${orderInfo.address}</div></div>
      <div class="field"><label>Contact</label><div>${orderInfo.email||'—'} &middot; ${orderInfo.phone||'—'}</div></div>
      <div class="field"><label>Delivery date</label><div>${orderInfo.date||'To be confirmed'}</div></div>
      <div class="field"><label>Paying with</label><div>Card ending in ${last4 || '••••'}</div></div>
      <h3 style="font-size:20px;margin:22px 0 8px;">Order</h3>
      ${orderSummaryHTML()}
      <div class="step-actions">
        <button class="link-btn" id="back-payment">&larr; Back</button>
        <button class="btn-primary" style="width:auto;padding:12px 28px;" id="place-order">Place order (demo)</button>
      </div>
    </div>`;
    document.getElementById('back-payment').addEventListener('click', ()=>{ checkoutStep='payment'; renderCheckout(); });
    document.getElementById('place-order').addEventListener('click', ()=>{
      const orderNum = 'BLM-' + Math.floor(10000+Math.random()*89999);
      const items = Object.entries(cart).map(([id,qty])=>{
        const p = PRODUCTS.find(p=>p.id===id);
        stock[id] = Math.max(0, (stock[id]||0) - qty);
        return {name:p.name, qty, price:p.price};
      });
      orders.unshift({num:orderNum, name:orderInfo.name, email:orderInfo.email, items, total:cartTotal(), date:new Date().toISOString().slice(0,10)});
      saveOrders(); saveStock();
      orderInfo.orderNum = orderNum;
      checkoutStep='confirm'; renderCheckout();
      cart = {}; saveCart(); renderCart();
    });
  }
  else if(checkoutStep==='confirm'){
    checkoutView.innerHTML = `<div class="checkout-wrap confirm">
      <div class="mark">&#10003;</div>
      <h2>Order placed</h2>
      <p style="opacity:.75;margin-bottom:24px;">Order ${orderInfo.orderNum} — a confirmation would normally be sent to ${orderInfo.email||'your email'}.</p>
      <button class="btn-primary" style="width:auto;padding:12px 28px;margin:0 auto;" id="back-to-shop">Back to shop</button>
    </div>`;
    document.getElementById('back-to-shop').addEventListener('click', ()=>{
      shopView.hidden=false; checkoutView.hidden=true; orderInfo={};
    });
  }
}

// ---- Admin view ----
const navShop = document.getElementById('nav-shop');
const navAdmin = document.getElementById('nav-admin');
const adminView = document.getElementById('admin-view');

function goShop(){
  shopView.hidden=false; adminView.hidden=true; detailView.hidden=true; checkoutView.hidden=true;
  navShop.classList.add('active'); navAdmin.classList.remove('active');
}
function goAdmin(){
  shopView.hidden=true; detailView.hidden=true; checkoutView.hidden=true; adminView.hidden=false;
  navAdmin.classList.add('active'); navShop.classList.remove('active');
  renderAdmin();
  window.scrollTo(0,0);
}
navShop.addEventListener('click', goShop);
navAdmin.addEventListener('click', goAdmin);

function renderAdmin(){
  const rows = PRODUCTS.map(p=>{
    const qty = stock[p.id];
    return `<tr>
      <td>${p.name}</td>
      <td><input type="number" min="0" step="0.01" data-price="${p.id}" value="${p.price}"></td>
      <td><input type="number" min="0" data-stock="${p.id}" value="${qty}"></td>
      <td class="${qty<=5?'stock-low':''}">${qty<=5 ? (qty===0?'Sold out':'Low stock') : ''}</td>
    </tr>`;
  }).join('');
  const orderRows = orders.length===0 ? '<div class="orders-empty">No orders yet — placed orders will show up here.</div>' :
    orders.map(o=>`<div class="order-card">
      <div class="oh"><span>${o.num}</span><span>${fmt(o.total)}</span></div>
      <div style="opacity:.75;">${o.name||'Guest'} &middot; ${o.date}</div>
      <div style="margin-top:6px;">${o.items.map(i=>`${i.name} × ${i.qty}`).join(', ')}</div>
    </div>`).join('');
  adminView.innerHTML = `<div class="admin-wrap">
    <h2 style="font-size:30px;font-style:italic;margin-bottom:20px;">Inventory</h2>
    <table class="admin-table">
      <thead><tr><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <h2 style="font-size:30px;font-style:italic;margin-bottom:16px;">Recent orders</h2>
    ${orderRows}
  </div>`;
  adminView.querySelectorAll('[data-price]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const p = PRODUCTS.find(p=>p.id===inp.dataset.price);
      const val = parseFloat(inp.value);
      if(!isNaN(val) && val>=0) p.price = val;
      renderGrid(); renderCart();
    });
  });
  adminView.querySelectorAll('[data-stock]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const val = parseInt(inp.value,10);
      stock[inp.dataset.stock] = isNaN(val) ? 0 : Math.max(0,val);
      saveStock();
      renderAdmin(); renderGrid();
    });
  });
}

// init
loadCart();
loadStock();
loadOrders();
renderFilters();
renderGrid();
renderCart();
</script>
</body>
</html>
